name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: generator tests
        run: uv run --frozen pytest -q

      # The image installs from requirements.txt; it must say what uv.lock says.
      - name: requirements.txt matches uv.lock
        run: |
          uv export --frozen --no-header --no-dev --no-emit-project --format requirements-txt -q -o /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: lint the chart
        run: |
          helm lint --strict chart -f chart/ci/all-features-values.yaml
          helm template ci chart -f chart/ci/all-features-values.yaml > /dev/null
