# The deploy key, from Infisical, into the Secret git-sync reads. Rendered
# only when an Infisical identity is given; otherwise that Secret is made by
# whoever installs the chart.
{{- with .Values.infisical }}
{{- if .identityId }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "cloud-docs.fullname" $ }}
  labels:
    {{- include "cloud-docs.labels" $ | nindent 4 }}
spec:
  resyncInterval: 300
  authentication:
    kubernetesAuth:
      identityId: {{ .identityId | quote }}
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: {{ .serviceAccount.name }}
        namespace: {{ .serviceAccount.namespace }}
      secretsScope:
        projectSlug: {{ required "infisical.projectSlug is required" .projectSlug | quote }}
        envSlug: {{ required "infisical.envSlug is required" .envSlug | quote }}
        secretsPath: {{ .secretsPath }}
  managedKubeSecretReferences:
    - secretName: {{ include "cloud-docs.sshSecret" $ }}
      secretNamespace: {{ $.Release.Namespace }}
      creationPolicy: Owner
{{- end }}
{{- end }}
