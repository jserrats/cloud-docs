# The app's token, from Infisical.
{{- with .Values.infisical }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: app1
  namespace: app1
spec:
  authentication:
    kubernetesAuth:
      identityId: {{ .identityId | quote }}
      serviceAccountRef:
        name: auth
        namespace: longhorn-system
      secretsScope:
        projectSlug: {{ .projectSlug | quote }}
        envSlug: {{ .envSlug | quote }}
        secretsPath: /app1
  managedKubeSecretReferences:
    - secretName: app1
      secretNamespace: app1
{{- end }}
