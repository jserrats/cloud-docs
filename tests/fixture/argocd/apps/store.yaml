apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
spec:
  source:
    repoURL: https://charts.example.com
    chart: longhorn
    targetRevision: 1.0.0
    helm:
      valuesObject:
        defaultSettings:
          defaultDataPath: /var/lib/longhorn
  destination:
    namespace: longhorn-system
