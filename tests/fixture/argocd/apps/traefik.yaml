apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
spec:
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 1.0.0
    helm:
      valuesObject:
        # acme.json on Longhorn.
        persistence:
          storageClass: longhorn
          size: 128Mi
  destination:
    namespace: traefik
