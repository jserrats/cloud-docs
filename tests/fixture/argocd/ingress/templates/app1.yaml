# https://app1.<domain>, LAN only.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app1
  namespace: app1
spec:
  routes:
    - kind: Rule
      match: {{ include "ingress.hosts" (list $ "app1") }}
      middlewares:
        - name: lan
      services:
        - name: app1
          port: 8080
  tls: {}
